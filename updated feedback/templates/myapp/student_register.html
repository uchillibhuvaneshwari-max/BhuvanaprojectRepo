<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #87CEEB, #e3f2fd);
            min-height: 100vh;
        }

        .register-card {
            border-radius: 20px;
            animation: fadeInUp 0.7s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-control, .form-select {
            border-radius: 10px;
        }

        .btn-register {
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-register:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-lg register-card p-4">
                <h3 class="text-center text-primary fw-bold mb-3">
                    🎓 Student Registration
                </h3>
                <hr>

                <!-- Messages -->
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} text-center">
                    {{ message }}
                </div>
                {% endfor %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="fw-bold">Student ID</label>
                        <input type="text" name="student_id" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold">Full Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold">Select Course</label>
                        <select name="course" class="form-select" required>
                            <option value="">Choose Course</option>
                            {% for course in courses %}
                                <option value="{{ course.id }}">{{ course.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="fw-bold">Select Trainer</label>
                        <select name="trainer" class="form-select" required>
                            <option value="">Choose Trainer</option>
                            {% for trainer in trainers %}
                                <option value="{{ trainer.id }}">
                                {{ trainer.name }} ({{ trainer.course.name }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-register">
                            Register Now
                        </button>
                    </div>

                </form>

                <hr>
                <p class="text-center">
                    Already registered?
                    <a href="{% url 'student_login' %}" class="fw-bold text-decoration-none">
                        Login Here
                    </a>
                </p>

            </div>
        </div>
    </div>
</div>

</body>
</html>
