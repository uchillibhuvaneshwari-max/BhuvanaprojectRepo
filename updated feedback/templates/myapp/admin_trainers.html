<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Trainers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            background: linear-gradient(180deg, #2c3e50, #1a252f);
            color: white;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: #ddd;
            padding: 12px 20px;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #0d6efd;
            color: white;
        }

        .active-menu {
            background: #0d6efd;
            color: white !important;
        }

        .main-content {
            margin-left: 240px;
            padding: 30px;
        }

        .header-card {
            background: linear-gradient(90deg, #28a745, #20c997);
            color: white;
            padding: 18px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .table thead {
            background: #343a40;
            color: white;
        }

        .table tbody tr:hover {
            background-color: #e8f4ff;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="{% url 'admin_dashboard' %}">🏠 Dashboard</a>
    <a href="{% url 'admin_students' %}">👩‍🎓 Students</a>
    <a href="{% url 'admin_trainers' %}" class="active-menu">👨‍🏫 Trainers</a>
    <a href="{% url 'admin_courses' %}">📚 Courses</a>
    <a href="{% url 'admin_feedback' %}">💬 Feedback</a>
    <a href="{% url 'admin_logout' %}">🚪 Logout</a>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="header-card shadow">
        👨‍🏫 Trainers List
    </div>
    <div class="mb-3 text-end">
         <a href="{% url 'add_trainer' %}" class="btn btn-warning shadow">
            ➕ Add New Trainer
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-bordered table-hover text-center">
                <thead>
                    <tr>
                        <th>Trainer Name</th>
                        <th>Course</th>
                    </tr>
                </thead>
                <tbody>
                    {% for trainer in trainers %}
                    <tr>
                        <td class="fw-bold text-primary">{{ trainer.name }}</td>
                        <td>
                            <span>
                                {{ trainer.course.name }}
                            </span>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="2" class="text-danger fw-bold">
                            No Trainers Found
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
