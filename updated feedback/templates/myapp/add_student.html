<!DOCTYPE html>
<html>

<head>
    <title>Add Student</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
    body {
        background: #f4f6f9;
    }

    .form-card {
        max-width: 600px;
        margin: 60px auto;
        border-radius: 12px;
    }
</style>

<body>

    <div class="container">
        <div class="card shadow form-card">
            <div class="card-header bg-primary text-white text-center">
                <h3>➕ Add New Student</h3>
            </div>

            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}

                    <!-- Student ID -->
                    <div class="mb-3">
                        <label class="form-label"><b>Student ID</b></label>
                        <input type="text" name="student_id" class="form-control" required>
                    </div>

                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label"><b>Student Name</b></label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label class="form-label"><b>Password</b></label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <!-- Course Dropdown -->
                    <div class="mb-3">
                        <label class="form-label"><b>Select Course</b></label>
                        <select name="course" class="form-control" required>
                            <option value="">-- Select Course --</option>
                            {% for course in courses %}
                            <option value="{{ course.id }}">{{ course.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Trainer Dropdown -->
                    <div class="mb-3">
                        <label class="form-label"><b>Select Trainer</b></label>
                        <select name="trainer" class="form-control" required>
                            <option value="">-- Select Trainer --</option>
                            {% for trainer in trainers %}
                            <option value="{{ trainer.id }}">
                                {{ trainer.name }} ({{ trainer.course.name }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Buttons -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">
                            💾 Save Student
                        </button>
                    </div>

                    <a href="{% url 'admin_students' %}" class="btn btn-secondary mt-3 w-100">
                        ← Back to Students List
                    </a>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
