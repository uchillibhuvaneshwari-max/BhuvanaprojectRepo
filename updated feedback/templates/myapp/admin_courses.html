<!DOCTYPE html>
<html>

<head>
    <title>Admin - Courses</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
    body {
        background: #f4f6f9;
        margin: 0;
    }

    .sidebar {
        width: 240px;
        height: 100vh;
        position: fixed;
        background: linear-gradient(180deg, #2c3e50, #1a252f);
        color: white;
        padding-top: 20px;
    }

    .sidebar a {
        display: block;
        color: #ddd;
        padding: 12px 20px;
        text-decoration: none;
    }

    .sidebar a:hover {
        background: #0d6efd;
        color: white;
    }

    .active-menu {
        background: #0d6efd;
        color: white !important;
    }

    .main-content {
        margin-left: 240px;
        padding: 30px;
    }

    .header-card {
        background: linear-gradient(90deg, #ff7b00, #ffb347);
        color: white;
        padding: 18px;
        border-radius: 10px;
        font-size: 24px;
        margin-bottom: 20px;
    }
</style>

<body>

    <div class="sidebar">
        <h2 class="text-center">Admin Panel</h2>
        <a href="{% url 'admin_dashboard' %}">🏠 Dashboard</a>
        <a href="{% url 'admin_students' %}">👩‍🎓 Students</a>
        <a href="{% url 'admin_trainers' %}">👨‍🏫 Trainers</a>
        <a href="{% url 'admin_courses' %}" class="active-menu">📚 Courses</a>
        <a href="{% url 'admin_feedback' %}">💬 Feedback</a>
        <a href="{% url 'admin_logout' %}">🚪 Logout</a>
    </div>

    <div class="main-content">
        <div class="header-card shadow">
            📚 Courses List
        </div>
       <div class="mb-3 text-end">
         <a href="{% url 'add_course' %}" class="btn btn-info shadow ">
            ➕ Add New Course
        </a>
       </div>

        <div class="card shadow">
            <div class="card-body">
                <table class="table table-striped table-bordered text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>Course ID</th>
                            <th>Course Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for course in courses %}
                        <tr>
                            <td>{{ course.id }}</td>
                            <td class="fw-bold text-primary">{{ course.name }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="2" class="text-danger fw-bold">
                                No Courses Available
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>

</html>
