<!DOCTYPE html>
<html>

<head>
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
/* Top center floating message */
.message-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    width: 40%;
}

/* Smooth animation */
.animated-alert {
    animation: slideDown 0.6s ease-in-out;
    border-radius: 12px;
    font-weight: 600;
    font-size: 16px;
}

/* Slide animation */
@keyframes slideDown {
    from {
        opacity: 0;
        transform: translate(-50%, -40px);
    }
    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}
</style>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4">
            <!-- Animated Success Messages -->
            {% if messages %}
            <div class="message-container">
                {% for message in messages %}
                <div class="alert alert-success alert-dismissible fade show shadow-lg text-center animated-alert"
                    role="alert">
                    🎉 {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <h3>Welcome, {{ student.name }}</h3>
            <hr>

            <p><strong>Course:</strong> {{ student.course.name }}</p>
            <p><strong>Trainer:</strong> {{ student.trainer.name }}</p>

            <hr>

            <div class="d-flex justify-content-between mt-3">

                <!-- Left Side -->
                <a class="btn btn-primary btn-sm" href="{% url 'student_feedback' %}">
                    Give Feedback
                </a>

                <!-- Right Side -->
                <a href="{% url 'home' %}" class="btn btn-danger btn-sm">
                    Logout
                </a>

            </div>


        </div>
    </div>
<script>
    // Auto hide success message after 3 seconds
    setTimeout(function () {
        const alertBox = document.querySelector('.alert');
        if (alertBox) {
            alertBox.classList.remove('show');
            alertBox.classList.add('fade');
            setTimeout(() => alertBox.remove(), 500);
        }
    }, 3000);
</script>
</body>


</html>
