<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body>


<div class="container-fluid mt-4">
    <div class="row">

        <!-- Page Heading -->
        <div class="col-12 mb-4">
            <h2 class="fw-bold text-primary">
                <i class="fas fa-user-edit"></i> Edit Student
            </h2>
        </div>

        <!-- Edit Card -->
        <div class="col-md-8 mx-auto">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-warning text-dark rounded-top-4">
                    <h4 class="mb-0 fw-bold">Update Student Details</h4>
                </div>

                <div class="card-body p-4">

                    <form method="POST">
                        {% csrf_token %}

                        <!-- Student ID -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Student ID</label>
                            <input type="text" name="student_id" class="form-control"
                                   value="{{ student.student_id }}" required>
                        </div>

                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Name</label>
                            <input type="text" name="name" class="form-control"
                                   value="{{ student.name }}" required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" name="email" class="form-control"
                                   value="{{ student.email }}" required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Password</label>
                            <input type="text" name="password" class="form-control"
                                   value="{{ student.password }}" required>
                        </div>

                        <!-- Course Dropdown -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Course</label>
                            <select name="course" class="form-select" required>
                                {% for course in courses %}
                                <option value="{{ course.id }}"
                                    {% if student.course and student.course.id == course.id %}selected{% endif %}>
                                    {{ course.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Trainer Dropdown -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Trainer</label>
                            <select name="trainer" class="form-select" required>
                                {% for trainer in trainers %}
                                <option value="{{ trainer.id }}"
                                    {% if student.trainer and student.trainer.id == trainer.id %}selected{% endif %}>
                                    {{ trainer.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'admin_students' %}" class="btn btn-secondary px-4">
                                ← Back
                            </a>

                            <button type="submit" class="btn btn-success px-4">
                                <i class="fas fa-save"></i> Update Student
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>

    </div>
</div>


</body>

</html>
